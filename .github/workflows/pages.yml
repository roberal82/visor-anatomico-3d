name: Comprobar compilación
# GitHub Pages publica la rama main desde la raíz (index.html, assets/, modelos/, draco/ ya compilados).
# Este workflow solo verifica que las pruebas y la compilación pasen.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: La compilación versionada debe estar al día
        run: git diff --exit-code -- index.html assets
